name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test (mcp-meta-indexer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORG_REPO_TOKEN }}

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      - name: Check Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release

      - name: Run Tests
        uses: actions-rs/cargo@v1
        with:
          command: test

      - name: Run Clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

  ci-docker:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: Volontariapp/ci-tools/.github/workflows/service-docker-build-push.yml@main
    with:
      service-name: mcp-meta-indexer
    secrets: inherit

  repo-deploy-push:
    name: Deploy Repo Submodule Push (mcp-meta-indexer)
    runs-on: ubuntu-latest
    needs: [ci, ci-docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Update Deploy Submodule and Images
        uses: Volontariapp/ci-tools/.github/actions/update-deploy@main
        with:
          service: "mcp-meta-indexer"
          sha: "${{ github.sha }}"
          org-repo-token: ${{ secrets.ORG_REPO_TOKEN }}
          image-match: 'ghcr.io/volontariapp/mcp-meta-indexer'
